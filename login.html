<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>
    <div class="container">
        <div class="container__banner">
            <img src="images/radio-concept-with-microphone.jpg" alt="">
        </div>
        <div class="container__login">
            <div class="login__title">ورود</div>
            <div class="login__caption">نام کاربری و گذرواژه خود را وارد کنید</div>
            <label for="username" class="login__lbl">نام کاربری</label>
            <input name="username" id="username" type="text" class="login__npt">
            <label for="password" class="login__lbl">گذرواژه</label>
            <input name="password" id="password" type="text" class="login__npt">
            <div class="footer">فراموش کردن گذرواژه</div>
            <input type="submit" class="npt-submit" value="ارسال">
        </div>
    </div>
</body>
</html>
